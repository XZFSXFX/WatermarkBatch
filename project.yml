# =============================================================================
# WatermarkBatch（水印工坊 BatchMark）— XcodeGen 工程描述
#
# 这份 YAML 是工程的唯一真相来源，project.pbxproj 是它的生成物。
# 生成命令（macOS）：xcodegen generate
#
# 为什么改成生成：手写 pbxproj 的合法性不归编译器管，是 OpenStep plist 语法
# （每条 key = value 必须分号结尾、裸字符串不得含逗号/括号/中文），
# 而编译只检查 Swift。两套语法互不覆盖，手写等于把工程文件放在无检查状态下维护。
#
# 加文件不用再改工程：sources 按目录递归收集，sbx 里新增 .swift 直接生效。
# =============================================================================

name: WatermarkBatch

options:
  bundleIdPrefix: com.watermarkbatch
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  minimumXcodeGenVersion: "2.38.0"
  xcodeVersion: "16.0"

configs:
  Debug: debug
  Release: release

# -----------------------------------------------------------------------------
# 工程级构建设置：两个配置共用 3 条铁律
#   SWIFT_VERSION 6.0 + SWIFT_STRICT_CONCURRENCY complete —— 并发标注必须显式
#   IPHONEOS_DEPLOYMENT_TARGET 17.0 —— 下限，不随 Xcode 版本漂移
# -----------------------------------------------------------------------------
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SDKROOT: iphoneos
    CODE_SIGN_STYLE: Automatic
    # 个人自用不上架，团队 ID 留空；真机签名在 Xcode 里选一次即可
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
    CLANG_ENABLE_MODULES: "YES"
    CLANG_ENABLE_OBJC_ARC: "YES"
    CLANG_ENABLE_OBJC_WEAK: "YES"
    CLANG_ANALYZER_NONNULL: "YES"
    CLANG_ANALYZER_NUMBER_OBJECT_CONVERSION: "YES_AGGRESSIVE"
    ENABLE_STRICT_OBJC_MSGSEND: "YES"
    ALWAYS_SEARCH_USER_PATHS: "NO"
    GCC_C_LANGUAGE_STANDARD: "gnu17"
    GCC_NO_COMMON_BLOCKS: "YES"
    MTL_FAST_MATH: "YES"
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(inherited)"
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_COMPILATION_MODE: singlefile
      ONLY_ACTIVE_ARCH: "YES"
      # 必须 YES：Tests 里 @testable import WatermarkBatch 依赖这条
      ENABLE_TESTABILITY: "YES"
      ENABLE_NS_ASSERTIONS: "NO"
      DEBUG_INFORMATION_FORMAT: dwarf
      GCC_OPTIMIZATION_LEVEL: "0"
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
      VALIDATE_PRODUCT: "NO"
      GCC_TREAT_WARNINGS_AS_ERRORS: "NO"
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      ONLY_ACTIVE_ARCH: "NO"
      ENABLE_TESTABILITY: "NO"
      ENABLE_NS_ASSERTIONS: "NO"
      DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
      GCC_OPTIMIZATION_LEVEL: s
      MTL_ENABLE_DEBUG_INFO: "NO"
      VALIDATE_PRODUCT: "YES"
      GCC_TREAT_WARNINGS_AS_ERRORS: "NO"

targets:
  # ---------------------------------------------------------------------------
  # App target：sources 指向 WatermarkBatch/ 并对子目录递归，
  # 排除 Tests / Tools / README / Info.plist（后者由 INFOPLIST_FILE 消费）
  # ---------------------------------------------------------------------------
  WatermarkBatch:
    type: application
    platform: iOS
    sources:
      - path: WatermarkBatch
        excludes:
          - "Tests/**"
          - "Tools/**"
          - "README.md"
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.watermarkbatch
        PRODUCT_NAME: "$(TARGET_NAME)"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: WatermarkBatch/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "水印工坊"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"

  # ---------------------------------------------------------------------------
  # Tests target：宿主是 App（AcceptanceTests 要跑 PhotoKit）
  # ---------------------------------------------------------------------------
  WatermarkBatchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WatermarkBatch/Tests
    dependencies:
      - target: WatermarkBatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.watermarkbatch.tests
        PRODUCT_NAME: "$(TARGET_NAME)"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_EMIT_LOC_STRINGS: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WatermarkBatch.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/WatermarkBatch"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@loader_path/Frameworks"

# -----------------------------------------------------------------------------
# Scheme：CI 直接 xcodebuild -scheme WatermarkBatch 就能 build / test
# -----------------------------------------------------------------------------
schemes:
  WatermarkBatch:
    build:
      targets:
        WatermarkBatch: all
        WatermarkBatchTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - WatermarkBatchTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
