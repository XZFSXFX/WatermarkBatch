name: iOS Build

# 工程文件由 XcodeGen 从 project.yml 生成，CI 与本地走同一条路径：
#   xcodegen generate → 校验 pbxproj → xcodebuild
# 手改 project.pbxproj 在 CI 里不会生效（会被重新生成覆盖），这是故意的。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: 生成工程 · 编译 · 守卫单测
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 .xcodeproj
        run: xcodegen generate

      - name: 校验生成的 pbxproj（OpenStep plist 语法 + 悬空 UUID）
        run: python3 WatermarkBatch/Tools/verify/validate_pbxproj.py WatermarkBatch.xcodeproj/project.pbxproj

      - name: 编译（模拟器，不签名）
        run: |
          set -o pipefail
          xcodebuild -project WatermarkBatch.xcodeproj \
                     -scheme WatermarkBatch \
                     -configuration Debug \
                     -destination 'generic/platform=iOS Simulator' \
                     -quiet \
                     CODE_SIGNING_ALLOWED=NO \
                     build 2>&1 | tee build.log

      # 只跑「并发限流」这一套：纯状态机，不碰文件系统，模拟器上确定可跑。
      # SourceGuardTests 靠 #filePath 读宿主源码，模拟器沙盒访问不到 /Users/runner/...
      # 必然红，因此改为只在 target 内编译、不进执行列表；
      # AcceptanceTests 需要真机相册与真实素材（Live Photo / 4K HDR / 音频 md5），
      # 在模拟器上必然失败，属于真机验收清单，同样不进 CI。
      - name: 单元测试（ConcurrencyLimiterTests）
        run: |
          set -o pipefail
          xcodebuild test -project WatermarkBatch.xcodeproj \
                          -scheme WatermarkBatch \
                          -destination 'platform=iOS Simulator,name=iPhone 16' \
                          -quiet \
                          CODE_SIGNING_ALLOWED=NO \
                          -only-testing:WatermarkBatchTests/ConcurrencyLimiterTests 2>&1 | tee test.log

      # 出包：真机 arm64、不签名。产物是未签名 .ipa，
      # 拿到后在 Windows 上用 Sideloadly / AltStore 自签安装（免费 Apple ID 7 天有效）。
      - name: 归档（真机，不签名）
        run: |
          set -o pipefail
          xcodebuild archive -project WatermarkBatch.xcodeproj \
                             -scheme WatermarkBatch \
                             -configuration Release \
                             -destination 'generic/platform=iOS' \
                             -archivePath build/WatermarkBatch.xcarchive \
                             -quiet \
                             CODE_SIGNING_ALLOWED=NO \
                             CODE_SIGNING_REQUIRED=NO 2>&1 | tee archive.log

      - name: 打包未签名 .ipa
        run: |
          set -euo pipefail
          APP="build/WatermarkBatch.xcarchive/Products/Applications/WatermarkBatch.app"
          if [ ! -d "$APP" ]; then
            echo "::error::归档产物里没有 WatermarkBatch.app"
            find build -maxdepth 5 -type d | head -40
            exit 1
          fi
          rm -rf Payload WatermarkBatch-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry WatermarkBatch-unsigned.ipa Payload
          ls -lh WatermarkBatch-unsigned.ipa

      - name: 上传未签名 .ipa
        uses: actions/upload-artifact@v4
        with:
          name: WatermarkBatch-ipa
          path: WatermarkBatch-unsigned.ipa
          if-no-files-found: error

      - name: 失败时回传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            test.log
            archive.log
          if-no-files-found: ignore
